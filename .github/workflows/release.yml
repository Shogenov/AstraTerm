name: AstraTerm Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and source
        id: version
        run: |
          python3 tools/sync_shared.py --check
          version=$(python3 -c 'from tools.sync_shared import product; print(product()["version"])')
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
              echo "The tag must match shared/product.json (v$version)." >&2
              exit 1
            fi
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Build and test Windows
        run: python tools/build.py windows --smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows
          path: dist/releases/${{ needs.plan.outputs.version }}/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  linux:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Linux build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-vte-2.91 \
            python3-paramiko python3-cryptography python3-yaml \
            librsvg2-common at-spi2-core openssh-client xauth xvfb xserver-xephyr
      - name: Build and test Linux
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' \
            bash -c '/usr/bin/python3 tools/build.py linux --smoke --display "$DISPLAY"'
          deb="dist/releases/$VERSION/linux/astraterm_${VERSION}_all.deb"
          test "$(dpkg-deb --field "$deb" Version)" = "$VERSION"
          diff -u <(printf '%s\n' debian-binary control.tar.xz data.tar.xz) <(ar t "$deb")
        env:
          VERSION: ${{ needs.plan.outputs.version }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux
          path: dist/releases/${{ needs.plan.outputs.version }}/linux/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push'
    needs: [plan, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    environment:
      name: production
      url: https://astraterminal.ru/
    concurrency:
      group: public-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist/releases/${{ needs.plan.outputs.version }}
      - name: Verify release assets
        run: python tools/release_artifacts.py "dist/releases/$VERSION" "$RUNNER_TEMP/github-release"
      - name: Prepare website publishing tools
        run: |
          python -m pip install -r tools/build-requirements-windows.txt
          python website/design-previews/build.py
      - name: Stage GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if state=$(gh release view "$tag" --json isDraft --jq '.isDraft'); then
            if [[ "$state" != true ]]; then
              echo "Release $tag is already public." >&2
              exit 1
            fi
          else
            gh release create "$tag" --draft --verify-tag --title "AstraTerm $VERSION" --generate-notes
          fi
          gh release upload "$tag" "$RUNNER_TEMP/github-release/"* --clobber
      - name: Sign and deploy to astraterminal.ru
        env:
          ASTRATERM_DEPLOY_HOST: ${{ secrets.ASTRATERM_DEPLOY_HOST }}
          ASTRATERM_DEPLOY_USER: ${{ secrets.ASTRATERM_DEPLOY_USER }}
          ASTRATERM_DEPLOY_PASSWORD: ${{ secrets.ASTRATERM_DEPLOY_PASSWORD }}
          ASTRATERM_DEPLOY_ROOT: ${{ secrets.ASTRATERM_DEPLOY_ROOT }}
          ASTRATERM_SIGNING_KEY: ${{ secrets.ASTRATERM_SIGNING_KEY }}
        run: |
          : "${ASTRATERM_DEPLOY_PASSWORD:?Configure the FTPS password in the production environment}"
          : "${ASTRATERM_SIGNING_KEY:?Configure the release signing key in the production environment}"
          umask 077
          signing_key=$(mktemp "$RUNNER_TEMP/release-signing.XXXXXX")
          trap 'rm -f -- "$signing_key"' EXIT
          printf '%s\n' "$ASTRATERM_SIGNING_KEY" > "$signing_key"
          unset ASTRATERM_SIGNING_KEY
          notes=$(git for-each-ref --format='%(contents)' "$GITHUB_REF")
          python tools/release.py --release-dir "dist/releases/$VERSION" \
            --site website/production/dist --signing-key "$signing_key" --notes "$notes"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false --latest
